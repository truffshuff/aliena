<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.55" stop-color="#2F6DF6"/>
      <stop offset="1" stop-color="#12B5A0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6DF6"/>
      <stop offset="1" stop-color="#12B5A0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16305F"/>
      <stop offset="1" stop-color="#0B1D3F"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1D3F" flood-opacity="0.32"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Tile (Apple macOS icon grid: 824px rounded square centered on 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <g clip-path="url(#tile)">
    <!-- Statement page with folded corner -->
    <g filter="url(#paperShadow)">
      <path d="M318 222 H604 L726 344 V772 A34 34 0 0 1 692 806 H318 A34 34 0 0 1 284 772 V256 A34 34 0 0 1 318 222 Z" fill="#FFFFFF"/>
    </g>
    <path d="M604 222 V312 A32 32 0 0 0 636 344 H726 Z" fill="#D5E3FF"/>

    <!-- Text rows -->
    <rect x="334" y="290" width="196" height="24" rx="12" fill="#C7D5EC"/>
    <rect x="334" y="342" width="128" height="24" rx="12" fill="#DCE5F3"/>

    <!-- Bars -->
    <rect x="346" y="610" width="58" height="138" rx="14" fill="#E4ECFB"/>
    <rect x="432" y="560" width="58" height="188" rx="14" fill="#E4ECFB"/>
    <rect x="518" y="590" width="58" height="158" rx="14" fill="#E4ECFB"/>
    <rect x="604" y="500" width="58" height="248" rx="14" fill="#E4ECFB"/>

    <!-- Trend line with arrow -->
    <polyline points="356,660 452,566 540,612 650,468" fill="none" stroke="url(#trend)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M598 452 L680 430 L668 514 Z" fill="#12B5A0" stroke="#12B5A0" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- OFX tag -->
  <g filter="url(#badgeShadow)">
    <rect x="566" y="702" width="236" height="104" rx="52" fill="url(#badge)"/>
  </g>
  <text x="684" y="774" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="4" fill="#FFFFFF">OFX</text>
</svg>
