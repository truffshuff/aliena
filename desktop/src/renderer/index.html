<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Aliena OFX Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <img class="logo" src="icon.png" alt="" />
        <div>
          <h1>Aliena OFX Converter</h1>
          <p>Trade confirmations → Quicken-ready OFX / QFX</p>
        </div>
      </div>
    </header>

    <main>
      <div id="update-banner" class="update-banner" hidden>
        <svg class="update-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 16V8" />
          <path d="M8.5 11.5L12 8l3.5 3.5" />
        </svg>
        <div class="update-text">
          <strong id="update-title"></strong>
          <span id="update-detail"></span>
          <div id="update-progress" class="update-progress" hidden><div id="update-bar"></div></div>
        </div>
        <div class="update-actions">
          <button id="update-notes" class="link">What's new</button>
          <button id="update-install" class="primary small"><span class="label">Install &amp; Restart</span></button>
          <button id="update-dismiss" class="remove" title="Later" aria-label="Dismiss">×</button>
        </div>
      </div>

      <section class="card">
        <div class="card-head">
          <h2>Confirmations</h2>
          <div class="head-actions">
            <span id="file-count" class="muted"></span>
            <button id="clear-files" class="link" hidden>Clear</button>
          </div>
        </div>

        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Add confirmation PDFs">
          <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <path d="M14 3v5h5" />
            <path d="M12 17v-6" />
            <path d="M9 14l3-3 3 3" />
          </svg>
          <div class="drop-text">
            <strong>Drop confirmation PDFs or a folder here</strong>
            <span>or <u>choose files…</u></span>
          </div>
        </div>

        <ul id="file-list" class="file-list"></ul>
      </section>

      <section class="card">
        <div class="card-head"><h2>Output</h2></div>

        <div class="format-row">
          <label>Format</label>
          <div class="segmented" id="format" role="radiogroup" aria-label="Output format">
            <button role="radio" data-format="qfx">QFX</button>
            <button role="radio" data-format="ofx">OFX</button>
            <button role="radio" data-format="both">Both</button>
          </div>
        </div>
        <p id="format-help" class="help"></p>

        <div class="row">
          <label>Save to</label>
          <div class="path-field">
            <span id="output-dir" class="path"></span>
            <button id="pick-output" class="secondary">Change…</button>
          </div>
        </div>
      </section>

      <section id="results" class="card results" hidden>
        <div class="card-head">
          <h2>Done</h2>
          <div class="head-actions">
            <button id="open-output" class="link">Open folder</button>
            <button id="clear-results" class="link">Clear</button>
          </div>
        </div>
        <div id="error-box" class="error-box" hidden>
          <div class="error-head">
            <strong>Conversion failed</strong>
            <button id="dismiss-error" class="remove" title="Dismiss" aria-label="Dismiss">×</button>
          </div>
          <span id="error-text"></span>
          <details id="error-details" class="log">
            <summary>Details</summary>
            <pre id="log"></pre>
          </details>
        </div>
        <ul id="done-list" class="done-list"></ul>
      </section>
    </main>

    <footer class="actionbar">
      <span id="status" class="muted"></span>
      <button id="convert" class="primary" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span class="label">Convert</span>
      </button>
    </footer>

    <script src="renderer.js"></script>
  </body>
</html>
