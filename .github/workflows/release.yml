name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds as workflow artifacts, no release

permissions:
  contents: write

jobs:
  build:
    name: Build (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bundle Python converter
        run: ./scripts/build-python.sh

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # DMG for first installs; ZIP is what the in-app updater downloads.
      - name: Build DMG and ZIP
        working-directory: desktop
        run: npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Download

            **`Aliena-OFX-Converter-*-arm64.dmg`** (Apple Silicon Macs: M1 and later).

            Already have the app? It updates itself: look for the update banner, or choose **Aliena OFX Converter → Check for Updates…**. The `.zip` is what the updater downloads.

            ## First install

            The app is not signed with an Apple Developer ID, so macOS blocks it the first time. After dragging it to Applications, either:

            - Try to open it, then go to **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**; or
            - Run in Terminal: `xattr -cr "/Applications/Aliena OFX Converter.app"`

            You only need to do this once. In-app updates don't trigger it again.
